services:
  # -------------------------------------------------------------
  # TelegramPublisher Main App Service
  # -------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: telegram_publisher
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL:-sqlite://data/publisher.db}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_OWNER_ID=${TELEGRAM_OWNER_ID:-0}
    volumes:
      - app_data:/app/data

  # -------------------------------------------------------------
  # Optional: PostgreSQL Backend (Run with --profile postgres)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tp_postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: telegram_publisher
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # -------------------------------------------------------------
  # Optional: MySQL Backend (Run with --profile mysql)
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: tp_mysql
    restart: unless-stopped
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: telegram_publisher
      MYSQL_USER: publisher
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  app_data:
  pg_data:
  mysql_data:
